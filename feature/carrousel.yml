feature:
  menu-carrousel:
    use:
      - menu-item
    description: A html container which can accept and distribute {menu-item[]} along a circle like a carrousel, with perspective and tilt effects.
    usage: Place {menu-item} elements inside this container to have them arranged in a circular layout with 3D perspective.
    configuration:
      fan: Controls the spread of items around the carrousel, from a tight cluster to a wide arc. with bias towards the front
      tilt: Adjusts the tilt and depth effect of the carrousel for a more pronounced 3D appearance. default being a slight tilt
      spin-speed: Sets the speed of automatic rotation of the carrousel, if enabled. A higher value results in faster spinning.
      auto-spin: Enables or disables automatic rotation of the carrousel. When enabled, the carrousel will slowly spin on its own.
      auto-spin-speed: Sets the speed of automatic rotation of the carrousel, if enabled. A higher value results in faster spinning.
      inertia: Controls the amount of inertia applied when dragging the carrousel. Higher values result in a more pronounced momentum effect.
    position: Centered of screen, where the {menu-item} appear to rotate around a central axis. Their size is controlled by their own styling.
    perspective: When {menu-item} is facing the camera directly, it is flat; it's size is natural; as it rotates away, it tilts and scales down to create a 3D effect
    interactivity:
      drag: Click and drag anywhere on screen to rotate the carrousel, bringing different items to the front. A drag of the mouse should spin the carrousel in that direction, with inertia for a smooth experience.
  menu-item:
    used in:
      - menu-carrousel
    description: A html element representing an item in a carrousel, which can be rotated and tilted in 3D space.
    usage: Place this element inside a {menu-carrousel} to have it arranged in a circular layout with 3D perspective.
    configuration:
      content: The HTML content to display within the item, such as text or images.
    position: Determined by parent {menu-carrousel}
    interactivity:
      drag: Click and drag anywhere on screen to rotate the carrousel, bringing different items to the front.
