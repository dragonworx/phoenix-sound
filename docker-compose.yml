services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: phoenixsound_postgres
    environment:
      POSTGRES_DB: phoenixsound
      POSTGRES_USER: phoenix_user
      POSTGRES_PASSWORD: phoenix_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: phoenixsound_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@phoenixsound.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  # Development service with hot reloading
  web-dev:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"  # Next.js dev server
    volumes:
      # Mount the entire project directory for hot reloading
      - .:/app
      # Preserve node_modules from the container
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://phoenix_user:phoenix_password@postgres:5432/phoenixsound
    command: bun run dev
    depends_on:
      - postgres

  # Production service
  web-prod:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://phoenix_user:phoenix_password@postgres:5432/phoenixsound
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
